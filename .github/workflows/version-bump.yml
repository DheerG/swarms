name: Bump version on merge

# Trigger note: GitHub Actions treats `[skip ci]` (and `[skip actions]`,
# `[no ci]`, etc.) anywhere in a push's HEAD commit message — title or
# body — as a request to suppress ALL workflows on that push. Squash-
# merges concatenate every PR commit message into the merge commit body,
# so a `[skip ci]` token mentioned in any PR commit body will prevent
# this workflow from running on merge. Reviewers: flag any PR commit
# that quotes the token literally; recover via the workflow_dispatch
# trigger below if it slips through.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_sha:
        description: "Merge commit SHA to attribute the bump to (defaults to current HEAD)."
        required: false
        type: string

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Bump version, commit, tag, and release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR_SHA: ${{ inputs.pr_sha }}
        run: |
          CURRENT=$(jq -r '.version' .claude-plugin/plugin.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          # Determine bump type from merged PR labels (default: patch).
          # On push, attribute to the PR whose merge commit equals the
          # event SHA. On workflow_dispatch, prefer the explicit pr_sha
          # input so a missed run can be recovered after the fact.
          LOOKUP_SHA="${INPUT_PR_SHA:-$GITHUB_SHA}"
          PR_NUMBER=$(gh pr list --state merged --base main --json number,mergeCommit \
            --jq ".[] | select(.mergeCommit.oid == \"$LOOKUP_SHA\") | .number")

          BUMP="patch"
          if [ -n "$PR_NUMBER" ]; then
            LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
            if echo "$LABELS" | grep -qx "major"; then
              BUMP="major"
            elif echo "$LABELS" | grep -qx "minor"; then
              BUMP="minor"
            fi
          fi

          case "$BUMP" in
            major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
            minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          jq --arg v "$NEW_VERSION" '.version = $v' .claude-plugin/plugin.json > tmp.json \
            && mv tmp.json .claude-plugin/plugin.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json
          git commit -m "chore: bump version to ${NEW_VERSION} [skip ci]"
          git tag -f "v${NEW_VERSION}"
          git push origin main
          git push origin "v${NEW_VERSION}" --force

          gh release create "v${NEW_VERSION}" --generate-notes 2>/dev/null \
            || gh release edit "v${NEW_VERSION}" --draft=false
